[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperflow-h3-flash"
version = "1.0.0"
description = "HyperFlow H3 Flash: a 13.7B, 4- to 8-step MiniMax-H3 for joint video and audio generation, on the official diffusers Modular Pipeline."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
authors = [{ name = "Video Rebirth" }]
keywords = ["diffusers", "minimax-h3", "video-generation", "audio-generation", "int8", "few-step"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  # First release with the MiniMax-H3 Modular Pipeline and its context parallel plan.
  "diffusers>=0.40.0",
  # The Qwen3-VL text encoder.
  "transformers>=4.57",
  # Offload hooks; diffusers' VAE `encode` / `decode` only fire them when accelerate is installed.
  "accelerate>=1.0",
  # CUDA builds bring the Triton the INT8 kernels need.
  "torch>=2.6",
  # Qwen3-VL's video processor, which the text encoder's processor loads.
  "torchvision",
  "safetensors",
  "huggingface_hub",
  # MP4 + AAC muxing of the output (`diffusers.utils.export_utils.encode_video`).
  "av",
]

[project.optional-dependencies]
# FlashAttention-3 from the Hub (`--attention fa3`, picked automatically on Hopper when installed).
hopper = ["kernels", "transformers[kernels]"]
# CUTLASS INT8 GEMM (`int8_gemm="sgl"`; match wheel to your torch version).
sgl = ["sgl-kernel"]
# The FP8 text encoder (`--text-encoder-precision fp8`): transformers runs its FP8 GEMM from the Hub.
fp8 = ["kernels", "transformers[kernels]"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
hyperflow-h3-flash = "hyperflow_h3_flash.cli:main"

[project.urls]
Homepage = "https://github.com/Video-Rebirth/hyperflow-h3-flash"
Weights = "https://huggingface.co/VideoRebirthAI/hyperflow-h3-flash"
Issues = "https://github.com/Video-Rebirth/hyperflow-h3-flash/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 119
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::FutureWarning"]
